name: smoke test

on: [push, pull_request]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m wharfmap render -i examples/demo/graph.json -o /tmp/out
      - run: python -m wharfmap generate -o /tmp/live   # the runner has Docker with a few containers; proves discovery runs end to end
      - run: test -s /tmp/out/index.html && test -s /tmp/live/graph.json
