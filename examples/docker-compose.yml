services:
  wharfmap:
    image: ghcr.io/hook-365/wharfmap:latest   # or: build: .
    container_name: wharfmap
    restart: unless-stopped
    ports:
      - "127.0.0.1:3008:3008"      # put your reverse proxy in front; this is a full port inventory
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./wharfmap.toml:/app/wharfmap.toml:ro
      - /opt/stacks:/opt/stacks:ro   # only needed for [[config_refs]] that read files
      - wharfmap-out:/out
    security_opt:
      - no-new-privileges:true
  # ---- agent mode: run this on every OTHER Docker host instead of the service above ----
  # wharfmap-agent:
  #   image: ghcr.io/hook-365/wharfmap:latest
  #   container_name: wharfmap-agent
  #   restart: unless-stopped
  #   command: agent
  #   environment:
  #     WHARFMAP_REPORT_URL: http://10.0.0.10:3008   # the host running `serve` (set WHARFMAP_TOKEN there too)
  #     WHARFMAP_TOKEN: pick-a-long-random-string
  #     WHARFMAP_HOST: nas                           # name on the map
  #     WHARFMAP_HOST_IP: 10.0.0.20                  # this host's LAN address
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   security_opt:
  #     - no-new-privileges:true

volumes:
  wharfmap-out:
